<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The product's own stylesheets: the video renders the real workspace markup against them. -->
<link rel="stylesheet" href="../../friendly-octo-fishstick/frontend/apps/web/src/styles.css">
<link rel="stylesheet" href="../../friendly-octo-fishstick/frontend/apps/web/src/svarah.css">
<link rel="stylesheet" href="../../friendly-octo-fishstick/frontend/apps/web/src/wordmark.css">
<link rel="stylesheet" href="../../friendly-octo-fishstick/frontend/apps/web/src/workspace/voice-workspace.css">
<link rel="stylesheet" href="../../friendly-octo-fishstick/frontend/apps/web/src/voice/voice-pill.css">
<style>
  *, *::before, *::after { transition: none !important; }
  html, body { width: 960px; height: 540px; overflow: hidden; background: #141513; }
  #stage { position: relative; width: 960px; height: 540px; overflow: hidden; background: #141513; }
  .layer { position: absolute; inset: 0; }

  /* ── app layer: real markup, frame-driven ── */
  #app { transform-origin: 480px 219px; }
  #app .vw-root { min-height: 0; height: 540px; position: relative; }
  #app .vw-head, #app .vw-dock { position: relative; }
  #app .vw-thread { gap: 0; overflow: hidden; justify-content: flex-end; padding: 0 120px 26px; position: relative; }
  #app .theme-toggle-btn { display: grid; place-items: center; border-radius: 50%; padding: 0; }
  .blk { padding-top: 14px; flex: none; }
  #hello { position: absolute; left: 0; right: 0; top: 62px; height: 314px; display: grid; place-items: center; pointer-events: none; }
  #hello .vw-hello { margin: 0; }
  #hello h1 span { display: inline-block; white-space: pre; }
  #facts-dl, #facts-actions { overflow: hidden; }
  #live-text { position: relative; }
  #listening { position: absolute; left: 0; top: 0; }
  .w { opacity: 0; }
  .caret-anchor { display: inline-block; width: 0; height: 0; overflow: visible; }
  .caret-anchor .vw-caret { margin-left: 3px; }
  #cur { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%;
    background: rgba(255,255,255,.22); border: 1.5px solid rgba(255,255,255,.75);
    box-shadow: 0 4px 18px rgba(0,0,0,.4); z-index: 50; opacity: 0; }

  /* ── result layer ── */
  #result { --vw-paper:#141513; --vw-surface:#212220; --vw-surface-2:#2a2b28; --vw-ink:#f1f2ec; --vw-muted:#9b9d93;
    --vw-line:rgba(255,255,255,.1); --vw-lime:#d8f878; --vw-chip:#2a3021; --vw-chip-ink:#bcd98d; --vw-good:#a9d06a;
    --vw-shadow:0 10px 30px rgba(0,0,0,.35); color: var(--vw-ink); opacity: 0;
    background: radial-gradient(620px 420px at 22% 55%, rgba(216,248,120,.10), transparent 70%), #141513; }
  #r-title { position: absolute; left: 418px; top: 38px; margin: 0; font: 800 32px/1.12 Manrope, sans-serif; letter-spacing: -1.3px; white-space: nowrap; }
  #r-title span { display: inline-block; white-space: pre; }
  #r-title .lime { color: #d8f878; }
  #r-poster { position: absolute; left: 70px; top: 86px; width: 300px; height: 375px; border-radius: 16px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.14); box-shadow: 0 30px 70px rgba(0,0,0,.55); transform-origin: 50% 60%; }
  #r-poster img { display: block; width: 100%; height: 100%; }
  #r-ptag { position: absolute; left: 70px; top: 478px; width: 300px; justify-content: center; margin: 0; }
  #r-grid { position: absolute; left: 418px; top: 128px; width: 482px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  #r-grid .vw-bubble { max-width: none; padding: 12px 14px; font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; }
  #r-grid .vw-tag { color: var(--vw-chip-ink); margin-bottom: 6px; }
  #r-foot { position: absolute; left: 418px; top: 474px; display: flex; align-items: center; gap: 10px; }
  #r-good { display: inline-flex; align-items: center; gap: 8px; background: var(--vw-chip); color: #d8f878;
    border-radius: 999px; padding: 11px 16px; font-size: 14px; font-weight: 700; }
  #r-good i { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: #d8f878; color: #1d1e19; }

  /* ── wipe + outro ── */
  #wipe { background: #d8f878; transform: translateY(100%); z-index: 60; }
  #outro { background: #fbfaf7; color: #191a17; display: grid; place-items: center; text-align: center; opacity: 0; }
  #outro .wm { font-size: 30px; margin-bottom: 30px; }
  #outro .svarah-eyebrow { margin-bottom: 16px; }
  #outro .svarah-headline { font-size: 64px; margin: 0 0 30px; white-space: nowrap; }
  #outro .button { margin: 0; font-size: 15px; padding: 16px 24px; }
  #o-url { margin-top: 16px; font: 500 13px 'DM Mono', monospace; letter-spacing: 1px; color: #777971; }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="app"></div>
  <div class="layer" id="result"></div>
  <div class="layer" id="outro"></div>
  <div class="layer" id="wipe"></div>
  <div id="cur"></div>
</div>
<script src="icons.js"></script>
<script src="data.js"></script>
<script>
const ic = (n, s = 15, sw = 2) => `<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const $ = (s) => document.querySelector(s);
const D = window.DATA;
const STEPS = ['Locking your offer', 'Writing your posts', 'Drafting the captions', 'Designing the poster', 'Checking every number'];
const words = D.transcript.split(' ');

// ── markup mirrors VoiceWorkspace.jsx ──────────────────────────────────
$('#app').innerHTML = `
<div class="vw-root">
  <header class="vw-head">
    <a class="wm wm--md vw-head-logo">SVARAH.AI</a>
    <button class="vw-ghost">${ic('plus')} New offer</button>
    <button class="vw-ghost">${ic('history')} History</button>
    <a class="vw-ghost">${ic('layout-grid')} Studio</a>
    <span class="vw-grow"></span>
    <button class="theme-toggle-btn">${ic('sun', 18)}</button>
    <span class="vw-avatar">SC</span>
    <button class="vw-ghost">${ic('log-out')}<span class="vw-signout-label">Sign out</span></button>
  </header>
  <div class="vw-body">
    <main class="vw-thread">
      <div class="blk" id="b-user"><div class="vw-row is-user"><div class="vw-bubble is-user is-live" id="user-bubble">
        <span class="vw-tag" id="user-tag"></span>
        <div id="live-text"><span id="listening">Listening…</span>${words.map((w, i) => `<span class="w">${w}${i < words.length - 1 ? ' ' : ''}</span>`).join('')}<span class="caret-anchor" id="caret"><span class="vw-caret"></span></span></div>
      </div></div></div>
      <div class="blk" id="b-facts"><div class="vw-row"><div class="vw-bubble is-app" style="min-width:430px">
        <span class="vw-tag">${ic('sparkles', 11)} Here is what I understood</span>
        <div id="facts-dl"><dl class="vw-facts">${D.rows.map((r) => `<dt>${r.label}</dt><dd>${r.value}</dd>`).join('')}</dl></div>
        <div id="facts-actions"><div class="vw-actions">
          <button class="vw-btn is-primary" id="confirm">${ic('check', 14)} Looks right — make my posts</button>
          <button class="vw-ghost">${ic('pencil', 13)} Fix something</button>
          <a class="vw-ghost">All details</a>
        </div></div>
      </div></div></div>
      <div class="blk" id="b-log"><div class="vw-row"><div class="vw-progress">${STEPS.map((s) => `<span class="vw-step">${ic('check', 12)} ${s}</span>`).join('')}</div></div></div>
      <div class="blk" id="b-busy"><div class="vw-row"><div class="vw-bubble is-app is-thinking"><span class="vw-dots"><i></i><i></i><i></i></span> <span id="busy-label"></span></div></div></div>
    </main>
    <div id="hello"><div class="vw-hello">
      <span class="vw-hello-mark">${ic('audio-lines', 26)}</span>
      <h1>${'What are you offering today?'.split(' ').map((w, i, a) => `<span>${w}${i < a.length - 1 ? ' ' : ''}</span>`).join('')}</h1>
      <p>Hold the microphone and say it in your own words.</p>
    </div></div>
  </div>
  <footer class="vw-dock">
    <button class="voice-pill" id="pill" data-state="idle" style="--vp-accent:#f5f5f5;--vp-icon:#a1a1aa;--vp-bg:#27272a;--vp-size:44px;--vp-radius:22px;--vp-reach:8px;--vp-extra:128px;--vp-clock-w:44px;--vp-wave-w:84px;--vp-stop:14px;--vp-icon-size:30px;--vp-time-size:16px;--vp-hit:0px">
      <span class="voice-pill__capsule"></span>
      <canvas class="voice-pill__wave" id="wave" width="168" height="56"></canvas>
      <span class="voice-pill__time" id="clock">0:00</span>
      <span class="voice-pill__glyph"><span class="voice-pill__mic">${ic('mic', 30)}</span><span class="voice-pill__stop"></span></span>
    </button>
    <button class="vw-ghost vw-mode-toggle">${ic('keyboard', 13)} Type instead</button>
  </footer>
</div>`;

const CH = [['Instagram', 'instagram'], ['WhatsApp', 'whatsapp'], ['Facebook', 'facebook'], ['X', 'x']];
$('#result').innerHTML = `
  <div id="r-poster"><img src="poster.png"></div>
  <span class="vw-tag" id="r-ptag">${ic('sparkles', 11)} Ready to share</span>
  <h2 id="r-title">${['One ', 'sentence ', 'in.'].map((w) => `<span>${w}</span>`).join('')}<br>${['A ', 'whole ', 'campaign ', 'out.'].map((w) => `<span class="lime">${w}</span>`).join('')}</h2>
  <div id="r-grid">${CH.map(([name, key]) => `<div class="vw-bubble is-app"><span class="vw-tag">${name}</span>${D.captions[key]}</div>`).join('')}</div>
  <div id="r-foot"><span id="r-good"><i>${ic('check', 13, 3)}</i> Every number matches your offer.</span><span class="vw-ghost" id="r-more">${ic('sparkles', 13)} Add speech or video</span></div>`;

const HL = ['CREATE ONCE.', 'PUBLISH EVERYWHERE.'];
$('#outro').innerHTML = `<div>
  <div class="wm" id="o-wm">SVARAH.AI</div>
  <div class="svarah-eyebrow" id="o-eye">VOICE FOR BUSINESS</div>
  <h1 class="svarah-headline" id="o-h">${HL.map((l) => l.split('').map((c) => `<span class="reveal-char">${c === ' ' ? '&nbsp;' : c}</span>`).join('')).join('<br>')}</h1>
  <div id="o-cta"><span class="button btn-lime">Start Creating Free ${ic('arrow-right', 17)}</span><div id="o-url">svarah.ai</div></div>
</div>`;

// ── timing (seconds; 100 BPM → beat 0.6, bar 2.4) ──────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, s, d) => clamp((t - s) / d);
const oc = (x) => 1 - Math.pow(1 - x, 3);
const io = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const ob = (x) => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const T = { press: 2.9, word0: 3.3, wordDt: 0.15, release: 6.5, facts: 7.2, row0: 7.5, rowDt: 0.3, actions: 9.3,
  click: 10.8, chip0: 11.4, chipDt: 0.6, result: 14.4, card0: 15.0, cardDt: 0.6, good: 17.4, wipe: 19.0, outro: 19.22, end: 22.4 };

let H = {};
const el = {};
function init() {
  for (const id of ['b-user', 'b-facts', 'b-log', 'b-busy']) H[id] = $('#' + id).offsetHeight;
  H.dl = $('#facts-dl').offsetHeight; H.act = $('#facts-actions').offsetHeight;
  H.dock = $('.vw-dock').offsetHeight;
  const r = $('#hello .vw-hello').getBoundingClientRect();
  H.helloY = r.top + r.height / 2;
  $('#app').style.transformOrigin = `480px ${r.top + r.height / 2}px`;
  H.hookScale = Math.min(2.1, 800 / $('#hello h1').getBoundingClientRect().width);
  window.DURATION = T.end;
}
const blk = (id, prog) => { const e = $('#' + id); e.style.height = H[id] * prog + 'px'; e.style.opacity = clamp(prog * 1.6 - 0.6); e.style.overflow = prog < 1 ? 'hidden' : 'visible'; };
const center = (sel) => { const r = $(sel).getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
const n1 = (x) => { const s = Math.sin(x * 127.1) * 43758.5453; return s - Math.floor(s); };

function render(t) {
  // CSS keyframe animations (dots, caret, live dot) become a pure function of t
  for (const a of document.getAnimations()) { a.pause(); a.currentTime = t * 1000; }

  // ── camera: hook is the app's own empty state, pushed in ──
  const zoomOut = io(p(t, 1.9, 0.8));
  const leave = p(t, T.result - 0.25, 0.25);
  const app = $('#app');
  const push = io(p(t, T.press + 0.1, 0.9)) * (1 - io(p(t, 6.8, 0.7)));   // lean in while they speak
  const sc = lerp(H.hookScale, 1, zoomOut) * (1 + 0.24 * push) * (1 + 0.06 * io(leave));
  app.style.transform = `translateY(${(270 - H.helloY) * (1 - zoomOut) - 110 * push}px) scale(${sc})`;
  app.style.opacity = 1 - leave;
  app.style.visibility = t >= T.result ? 'hidden' : 'visible';
  $('.vw-head').style.opacity = p(t, 2.0, 0.6);
  const dockAway = io(p(t, 6.9, 0.5));
  $('.vw-root').style.height = 540 + H.dock * dockAway + 'px';
  $('.vw-dock').style.opacity = p(t, 2.0, 0.6) * (1 - dockAway);

  // hook
  const helloOut = p(t, T.press, 0.16);
  $('#hello').style.opacity = 1 - helloOut;
  $('#hello').style.transform = `translateY(${-10 * helloOut}px)`;
  $('.vw-hello-mark').style.transform = `scale(${ob(p(t, 0.0, 0.4)) * (1 + 0.05 * Math.sin(t * Math.PI / 0.6) * (t > 0.4 ? 1 : 0))})`;
  $('.vw-hello-mark').style.opacity = p(t, 0, 0.15);
  document.querySelectorAll('#hello h1 span').forEach((s, i) => { const q = oc(p(t, 0.2 + i * 0.08, 0.35)); s.style.opacity = q; s.style.transform = `translateY(${14 * (1 - q)}px)`; });
  const hp = oc(p(t, 0.95, 0.4)); $('#hello p').style.opacity = hp; $('#hello p').style.transform = `translateY(${8 * (1 - hp)}px)`;

  // ── mic pill ──
  const listen = oc(p(t, T.press, 0.2)) * (1 - oc(p(t, T.release, 0.2)));
  const pill = $('#pill');
  const pressed = (t >= T.press - 0.05 && t < T.release + 0.05);
  pill.style.transform = `scale(${pressed ? lerp(1, 0.95, p(t, T.press - 0.05, 0.08)) : 1})`;
  pill.style.color = listen > 0.5 ? '#f5f5f5' : '#a1a1aa';
  $('.voice-pill__capsule').style.clipPath = `inset(0 0 0 ${136 * (1 - listen)}px round 22px)`;
  for (const s of ['#wave', '#clock']) { $(s).style.opacity = listen; $(s).style.filter = `blur(${2 * (1 - listen)}px)`; }
  $('.voice-pill__mic').style.opacity = 1 - listen; $('.voice-pill__mic').style.transform = `scale(${lerp(1, 0.7, listen)})`;
  $('.voice-pill__stop').style.opacity = listen; $('.voice-pill__stop').style.transform = `scale(${lerp(0.6, 1, listen)})`; $('.voice-pill__stop').style.filter = 'none';
  $('#clock').textContent = '0:0' + Math.floor(clamp(t - T.press, 0, 9));
  const cv = $('#wave'), g = cv.getContext('2d'); g.clearRect(0, 0, 168, 56); g.fillStyle = '#f5f5f5';
  const speaking = p(t, T.word0 - 0.1, 0.2) * (1 - p(t, T.word0 + words.length * T.wordDt, 0.35));
  for (let i = 0; i < 21; i++) {
    const k = t * 7 - i * 0.55, f = Math.floor(k), fr = k - f;
    const v = lerp(n1(f + i * 3.7), n1(f + 1 + i * 3.7), fr * fr * (3 - 2 * fr));
    const h = 6 + 46 * (0.1 + 0.9 * speaking) * v * (0.55 + 0.45 * Math.sin(i / 20 * Math.PI));
    g.beginPath(); g.roundRect(i * 8, 28 - h / 2, 4, h, 2); g.fill();
  }

  // ── thread ──
  blk('b-user', oc(p(t, T.press + 0.2, 0.3)));
  const live = t < T.release;
  $('#user-bubble').classList.toggle('is-live', live);
  $('#user-tag').innerHTML = live ? '<span class="vw-live-dot"></span> Live' : 'You said';
  const shown = clamp(Math.floor((t - T.word0) / T.wordDt) + 1, 0, words.length);
  $('#listening').style.opacity = shown === 0 ? 0.8 : 0;
  const ws = document.querySelectorAll('.w'); ws.forEach((w, i) => { w.style.opacity = i < shown ? 1 : 0; });
  const caret = $('#caret'); caret.style.display = live && shown > 0 ? 'inline-block' : 'none';
  if (shown > 0 && caret.previousSibling !== ws[shown - 1]) ws[shown - 1].after(caret);

  const busy1 = oc(p(t, T.release + 0.05, 0.25)) * (1 - io(p(t, T.facts, 0.2)));
  const busy2 = oc(p(t, T.click + 0.1, 0.25)) * (1 - io(p(t, T.chip0 + 4 * T.chipDt, 0.2)));
  blk('b-busy', Math.max(busy1, busy2));
  const si = clamp(Math.floor((t - T.click) / T.chipDt), 0, 4);
  $('#busy-label').textContent = t < T.click ? 'Transcribing what you said…' : STEPS[si];

  blk('b-facts', oc(p(t, T.facts, 0.35)));
  let rowsShown = 0;
  const dts = document.querySelectorAll('#facts-dl dt'), dds = document.querySelectorAll('#facts-dl dd');
  D.rows.forEach((_, i) => { const q = oc(p(t, T.row0 + i * T.rowDt, 0.28)); rowsShown += q;
    for (const e of [dts[i], dds[i]]) { e.style.opacity = q; e.style.transform = `translateX(${10 * (1 - q)}px)`; } });
  $('#facts-dl').style.height = H.dl * (rowsShown / D.rows.length) + 'px';
  const act = oc(p(t, T.actions, 0.3)) * (1 - io(p(t, T.click + 0.12, 0.25)));
  $('#facts-actions').style.height = H.act * act + 'px'; $('#facts-actions').style.opacity = act;
  const clickP = p(t, T.click - 0.06, 0.08) * (1 - p(t, T.click + 0.04, 0.1));
  $('#confirm').style.transform = `scale(${1 - 0.05 * clickP})`; $('#confirm').style.filter = `brightness(${1 + 0.12 * clickP})`;

  blk('b-log', oc(p(t, T.chip0 - 0.1, 0.25)));
  document.querySelectorAll('#b-log .vw-step').forEach((c, i) => { const q = p(t, T.chip0 + i * T.chipDt, 0.3);
    c.style.opacity = clamp(q * 3); c.style.transform = `scale(${q > 0 ? ob(q) : 0.6})`; });

  // ── cursor (touch dot) ──
  const cur = $('#cur'); let cx = 0, cy = 0, co = 0, cs = 1;
  if (t >= 2.3 && t < T.release + 0.35) {
    const [px, py] = center('.voice-pill__glyph'); const q = io(p(t, 2.3, 0.5));
    cx = lerp(px + 150, px, q); cy = lerp(py + 140, py, q);
    co = p(t, 2.3, 0.25) * (1 - p(t, T.release + 0.05, 0.3)); cs = t >= T.press - 0.05 && t < T.release ? 0.82 : 1;
  } else if (t >= 9.5 && t < T.click + 0.4) {
    const [bx, by] = center('#confirm'); const q = io(p(t, 9.6, 0.9));
    cx = lerp(bx + 220, bx + 30, q); cy = lerp(by + 150, by + 4, q);
    co = p(t, 9.5, 0.3) * (1 - p(t, T.click + 0.1, 0.3)); cs = 1 - 0.2 * clickP;
  }
  cur.style.left = cx + 'px'; cur.style.top = cy + 'px'; cur.style.opacity = co; cur.style.transform = `scale(${cs})`;

  // ── result ──
  const res = $('#result'); const out = io(p(t, T.wipe - 0.1, 0.3));
  res.style.opacity = t >= T.result ? 1 : 0;
  const pq = oc(p(t, T.result, 0.55)), drift = clamp((t - T.result) / 4.8);
  $('#r-poster').style.opacity = clamp(p(t, T.result, 0.2));
  $('#r-poster').style.transform = `translateY(${40 * (1 - pq) - 14 * out}px) rotate(${lerp(3, -3, pq) + drift}deg) scale(${lerp(1.28, 1, pq) + 0.03 * drift})`;
  const tg = oc(p(t, T.result + 0.45, 0.35)); $('#r-ptag').style.opacity = tg * 0.9;
  document.querySelectorAll('#r-title span').forEach((s, i) => { const q = oc(p(t, T.result + 0.1 + i * 0.07, 0.35)); s.style.opacity = q; s.style.transform = `translateY(${16 * (1 - q)}px)`; });
  document.querySelectorAll('#r-grid .vw-bubble').forEach((c, i) => { const q = oc(p(t, T.card0 + i * T.cardDt, 0.4)); c.style.opacity = q; c.style.transform = `translateY(${22 * (1 - q)}px) scale(${lerp(0.96, 1, q)})`; });
  const gq = p(t, T.good, 0.4); $('#r-good').style.opacity = clamp(gq * 3); $('#r-good').style.transform = `scale(${gq > 0 ? ob(gq) : 0.7})`;
  const mq = oc(p(t, T.good + 0.35, 0.35)); $('#r-more').style.opacity = mq; $('#r-more').style.transform = `translateX(${-10 * (1 - mq)}px)`;

  // ── wipe + outro ──
  const w1 = io(p(t, T.wipe, 0.22)), w2 = io(p(t, T.outro, 0.3));
  $('#wipe').style.transform = `translateY(${100 - 100 * w1 - 100 * w2}%)`;
  $('#outro').style.opacity = t >= T.outro ? 1 : 0;
  const up = (sel, s, d = 0.45, dy = 18) => { const q = oc(p(t, s, d)); $(sel).style.opacity = q; $(sel).style.transform = `translateY(${dy * (1 - q)}px)`; };
  up('#o-wm', T.outro + 0.12); up('#o-eye', T.outro + 0.2);
